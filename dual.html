<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Primstav</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap');

:root {
  --bark:       #2c1a0e;
  --dark-wood:  #140c04;
  --parchment:  #f4e4c0;
  --rune-gold:  #c8922a;
  --rune-red:   #8b2615;
  --move-org:   #b04000;
  --stave-w:    44px;    /* plank width */
  --day-h:      22px;    /* height per day */
}

* { margin:0; padding:0; box-sizing:border-box; }

html { background: var(--dark-wood); }

body {
  background: var(--dark-wood);
  background-image:
    repeating-linear-gradient(90deg, transparent 0, transparent 39px, rgba(255,255,255,0.012) 39px, rgba(255,255,255,0.012) 40px),
    repeating-linear-gradient(0deg,  transparent 0, transparent 59px, rgba(0,0,0,0.08) 59px, rgba(0,0,0,0.08) 60px);
  min-height: 100vh;
  font-family: 'Lora', serif;
  color: #e8d8b0;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 1.5rem 0.5rem 5rem;
}

/* ── HEADER ── */
header { text-align:center; margin-bottom:1.2rem; }
h1 {
  font-family:'Cinzel',serif;
  font-size: clamp(1.8rem,7vw,3.2rem);
  color: var(--rune-gold);
  letter-spacing:.2em;
  text-shadow: 0 2px 8px rgba(0,0,0,.8), 0 0 30px rgba(200,146,42,.3);
}
.subtitle {
  font-style:italic; color:#a08060; font-size:.85rem;
  margin-top:.3rem; letter-spacing:.1em;
}
.rune-div {
  display:flex; align-items:center; gap:.8rem;
  margin:.6rem auto; width:fit-content;
}
.rune-div span { color:var(--rune-gold); font-size:1.2rem; opacity:.7; }
.rune-div::before,.rune-div::after {
  content:''; width:50px; height:1px;
  background:linear-gradient(90deg,transparent,var(--rune-gold),transparent);
}

/* ── MODE BAR ── */
.mode-bar {
  display:flex; margin-bottom:1rem;
  border:1px solid rgba(200,146,42,.35);
  border-radius:4px; overflow:hidden;
}
.mode-btn {
  background:transparent; border:none;
  color:#a08060; font-family:'Cinzel',serif;
  font-size:.65rem; letter-spacing:.08em;
  padding:.4rem .9rem; cursor:pointer; transition:all .15s;
  border-right:1px solid rgba(200,146,42,.2);
}
.mode-btn:last-child { border-right:none; }
.mode-btn:hover { background:rgba(200,146,42,.08); color:var(--rune-gold); }
.mode-btn.active {
  background:rgba(200,146,42,.18); color:var(--rune-gold);
  text-shadow:0 0 8px rgba(200,146,42,.4);
}

/* ── YEAR LABEL ── */
.year-label {
  font-family:'Cinzel',serif; color:var(--rune-gold);
  font-size:.8rem; letter-spacing:.2em; opacity:.7;
  margin-bottom:.8rem;
}

/* ── STAVE PAIR WRAPPER ── */
.stave-pair {
  display:flex;
  gap: clamp(2.5rem, 8vw, 5rem);
  align-items:flex-start;
  justify-content:center;
  width:100%;
  max-width:360px;
}

/* ── SINGLE STAVE COLUMN ── */
.stave-col {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:0;
}

.half-label {
  font-family:'Cinzel',serif;
  font-size:.65rem; color:var(--rune-gold);
  letter-spacing:.15em; text-transform:uppercase;
  opacity:.75; margin-bottom:.5rem;
}

/* ── STAVE PLANK (SVG-drawn wood feel) ── */
.stave-plank {
  position:relative;
  width: var(--stave-w);
  background:
    linear-gradient(90deg,
      #120802 0%,
      #2e1508 6%,
      #5a2e10 18%,
      #6e3a16 35%,
      #7a4420 50%,
      #6e3a16 65%,
      #5a2e10 82%,
      #2e1508 94%,
      #120802 100%);
  box-shadow:
    inset 3px  0 8px rgba(0,0,0,.55),
    inset -3px 0 8px rgba(0,0,0,.55),
    5px 0 14px rgba(0,0,0,.7),
    -3px 0 10px rgba(0,0,0,.5);
  /* grain overlay via repeating gradient */
  background-size: 100% 100%;
}
/* subtle grain lines */
.stave-plank::before {
  content:''; position:absolute; inset:0; pointer-events:none;
  background:
    repeating-linear-gradient(180deg,
      transparent 0, transparent 7px,
      rgba(0,0,0,.04) 7px, rgba(0,0,0,.04) 8px),
    repeating-linear-gradient(180deg,
      transparent 0, transparent 19px,
      rgba(255,255,255,.025) 19px, rgba(255,255,255,.025) 20px);
}

/* top & bottom end-grain caps */
.cap {
  width: var(--stave-w);
  height: 10px;
}
.cap.top {
  background: radial-gradient(ellipse at 50% 30%, #8a5030 0%, #3e1c08 60%, #1a0a04 100%);
  border-radius:8px 8px 0 0;
  box-shadow: 0 -3px 6px rgba(0,0,0,.5);
}
.cap.bottom {
  background: radial-gradient(ellipse at 50% 70%, #5a2e10 0%, #220e04 70%, #110602 100%);
  border-radius:0 0 10px 10px;
  box-shadow: 0 5px 10px rgba(0,0,0,.7);
}

/* month divider band on plank */
.month-band {
  position:relative;
  width:100%;
  border-top: 1.5px solid rgba(160,110,50,.45);
}
.month-band:first-child { border-top:none; }

.month-tag {
  position:absolute;
  left:50%; transform:translateX(-50%);
  top: -9px;
  font-family:'Cinzel',serif;
  font-size:6.5px; font-weight:700;
  color: var(--rune-gold);
  background: #2e1508;
  border:1px solid rgba(200,146,42,.35);
  border-radius:2px;
  padding:0 3px;
  letter-spacing:.06em;
  white-space:nowrap;
  z-index:2;
  text-shadow:0 1px 3px rgba(0,0,0,.9);
}

/* ── DAY SLOT ── */
.day-slot {
  position:relative;
  width:100%;
  height: var(--day-h);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition: background .1s;
}
.day-slot:hover { background: rgba(255,200,100,.07); }
.day-slot.selected { background: rgba(255,200,100,.12); }

/* The carved mark */
.mark {
  position:absolute;
  left:50%; transform:translateX(-50%);
  display:flex; flex-direction:column;
  align-items:center; gap:0;
}

/* vertical stem */
.stem {
  width:2px; height:12px;
  background:rgba(200,160,80,.55);
  border-radius:1px;
}
/* horizontal crossbar (for feasts) */
.cross {
  width:10px; height:2px;
  border-radius:1px;
  margin-bottom:-1px; /* sits above stem */
}

.day-slot.sunday   .stem { width:3px; height:16px; background:var(--rune-gold); box-shadow:0 0 4px rgba(200,146,42,.6); }
.day-slot.today    .stem { background:#ff6644; box-shadow:0 0 6px rgba(255,100,68,.8); width:3px; }
.day-slot.feast    .stem { background:var(--rune-red); }
.day-slot.feast    .cross { background:var(--rune-red); }
.day-slot.moveable .stem { background:var(--move-org); }
.day-slot.moveable .cross { background:var(--move-org); }
.day-slot.today.feast    .stem { background:#ff6644; }
.day-slot.today.moveable .stem { background:#ff6644; }

/* golden number badge */
.gn-badge {
  position:absolute;
  top:1px; right:3px;
  font-family:'Cinzel',serif;
  font-size:7px; font-weight:700;
  color:var(--rune-gold);
  background:rgba(14,6,2,.85);
  border-radius:2px; padding:0 1.5px;
  line-height:1.2;
  text-shadow:0 0 3px rgba(0,0,0,1);
  pointer-events:none;
}

/* day number label (left side) */
.day-num {
  position:absolute;
  right: calc(100% + 5px);
  font-size:7px;
  color:rgba(180,140,80,.5);
  font-family:'Cinzel',serif;
  white-space:nowrap;
  line-height:1;
  user-select:none;
}
/* show only on 1st, 5th, 10th, 15th, 20th, 25th */
.day-num.hidden { display:none; }

/* ── POPUP ── */
.popup-overlay {
  position:fixed; inset:0;
  background:rgba(0,0,0,.55);
  z-index:50;
  display:none;
  align-items:flex-end;
  justify-content:center;
}
.popup-overlay.open { display:flex; }

.popup {
  background: var(--parchment);
  background-image:
    radial-gradient(ellipse at 20% 8%, rgba(255,255,200,.3) 0%, transparent 55%);
  width:100%; max-width:460px;
  border-radius:14px 14px 0 0;
  padding:1.4rem 1.5rem 2.2rem;
  position:relative;
  box-shadow:0 -8px 40px rgba(0,0,0,.7);
  border-top:3px solid;
  border-image: linear-gradient(90deg,var(--rune-red),var(--rune-gold),var(--rune-red)) 1;
  color: var(--bark);
  max-height:82vh; overflow-y:auto;
  animation: slideUp .22s ease;
}
@keyframes slideUp {
  from { transform:translateY(40px); opacity:0; }
  to   { transform:translateY(0);    opacity:1; }
}

.popup-close {
  position:absolute; top:.9rem; right:1rem;
  background:transparent; border:none;
  color:#8a5020; font-size:1.4rem; cursor:pointer; line-height:1;
}

.popup-date {
  font-family:'Cinzel',serif; font-size:1.5rem;
  color:var(--bark); font-weight:600; line-height:1.1;
}
.popup-tradname {
  font-style:italic; color:var(--rune-red);
  font-size:.92rem; margin-top:.15rem; min-height:1.2rem;
}
.popup-sub {
  font-size:.8rem; color:#7a4020; font-style:italic;
  margin-top:.1rem; margin-bottom:.9rem;
  border-bottom:1px solid rgba(100,60,20,.2);
  padding-bottom:.7rem;
}
.popup-gn {
  display:inline-flex; align-items:center; gap:.4rem;
  background:rgba(200,146,42,.1); border:1px solid rgba(200,146,42,.3);
  border-radius:3px; padding:.15rem .55rem;
  font-family:'Cinzel',serif; font-size:.75rem;
  color:var(--rune-gold); margin-bottom:.8rem;
}
.popup-season {
  display:flex; align-items:center; gap:.8rem; margin-bottom:.8rem;
}
.season-emoji { font-size:2.2rem; }
.season-info .slabel {
  font-family:'Cinzel',serif; font-size:.65rem;
  letter-spacing:.1em; color:var(--rune-red); text-transform:uppercase;
}
.season-info .sval { font-size:.9rem; color:var(--bark); }
.season-rune { font-size:1.8rem; color:var(--rune-gold); margin-left:auto; }

.feast-box {
  border-left:3px solid var(--rune-red);
  padding:.65rem .85rem; margin-top:.5rem;
  border-radius:0 3px 3px 0;
  background:rgba(139,38,21,.06);
}
.feast-box.mov { border-left-color:var(--move-org); background:rgba(176,64,0,.06); }
.feast-name {
  font-family:'Cinzel',serif; font-size:.9rem;
  color:var(--rune-red); font-weight:600;
}
.feast-box.mov .feast-name { color:var(--move-org); }
.feast-folk { font-style:italic; font-size:.8rem; color:#7a4010; margin-top:.1rem; }
.feast-desc { font-size:.78rem; color:#5a3018; margin-top:.2rem; font-style:italic; line-height:1.5; }

.moon-row { display:flex; gap:.5rem; margin-top:.8rem; flex-wrap:wrap; }
.moon-tag {
  background:rgba(44,26,14,.08);
  border:1px solid rgba(100,70,30,.3);
  border-radius:20px; padding:.18rem .65rem;
  font-size:.75rem; color:#5a3018;
}

/* ── LEGEND ── */
.legend {
  display:flex; flex-wrap:wrap; gap:.8rem 1.2rem;
  margin-top:2rem; justify-content:center; opacity:.65;
}
.leg {
  display:flex; align-items:center; gap:.35rem;
  font-size:.68rem; color:#a08060; font-style:italic;
}
.lm { width:3px; height:13px; border-radius:1px; }
.lm-d { background:rgba(200,160,80,.6); }
.lm-s { background:var(--rune-gold); }
.lm-f { background:var(--rune-red); }
.lm-m { background:var(--move-org); }
.lm-t { background:#ff6644; }
.lm-g { width:8px; height:8px; border-radius:50%; background:var(--rune-gold); border:1.5px solid rgba(200,146,42,.4); }
</style>
</head>
<body>

<header>
  <h1>PRIMSTAV</h1>
  <div class="rune-div"><span>ᚱ</span></div>
  <p class="subtitle">Den norske bondealmanak</p>
</header>

<div class="mode-bar">
  <button class="mode-btn active" data-mode="kirke">Kirkenavn</button>
  <button class="mode-btn" data-mode="folk">Folkenavn</button>
  <button class="mode-btn" data-mode="dag">Dagsnavn</button>
</div>

<div class="year-label" id="yearLabel"></div>

<div class="stave-pair">
  <div class="stave-col" id="winterCol">
    <div class="half-label">Vinter ᛁ</div>
    <div class="cap top"></div>

  </div>
  <div class="stave-col" id="summerCol">

  </div>
</div>

<div class="legend">

  <div class="leg"><div class="lm lm-s"></div>Søndag</div>
  <div class="leg"><div class="lm lm-f"></div>Fast helligdag</div>
  <div class="leg"><div class="lm lm-m"></div>Bevegelig høytid</div>
  <div class="leg"><div class="lm lm-t"></div>I dag</div>
  <div class="leg"><div class="lm lm-g"></div>Gyllentall</div>
</div>

<!-- Popup -->
<div class="popup-overlay" id="overlay">
  <div class="popup" id="popup">
    <button class="popup-close" id="popupClose">×</button>
    <div class="popup-date"    id="pDate"></div>
    <div class="popup-tradname" id="pTrad"></div>
    <div class="popup-sub"    id="pSub"></div>
    <div id="pGolden"></div>
    <div class="popup-season" id="pSeason"></div>
    <div id="pFeast"></div>
    <div class="moon-row"     id="pMoon"></div>
  </div>
</div>

// Easter (Anonymous Gregorian)
function easter(yr) {
  const a=yr%19,b=Math.floor(yr/100),c=yr%100,d=Math.floor(b/4),e=b%4;
  const f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3);
  const h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4;
  const l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
  const mo=Math.floor((h+l-7*m+114)/31),dy=((h+l-7*m+114)%31)+1;
  return new Date(yr,mo-1,dy);
}

function moonPhase(date) {
  const p=((((date-new Date(2000,0,6))/86400000)%29.53058867)+29.53058867)%29.53058867;
  if(p<1.85)  return{e:'🌑',n:'Nymåne'};
  if(p<7.38)  return{e:'🌒',n:'Tiltagende halvmåne'};
  if(p<9.22)  return{e:'🌓',n:'Halvmåne'};
  if(p<14.76) return{e:'🌔',n:'Tiltagende måne'};
  if(p<16.61) return{e:'🌕',n:'Fullmåne'};
  if(p<22.15) return{e:'🌖',n:'Avtagende måne'};
  if(p<23.99) return{e:'🌗',n:'Halvmåne'};
  return{e:'🌘',n:'Avtagende halvmåne'};
}

function season(m0) {
  const m=m0+1;
  if(m===12||m<=2) return{e:'❄️',n:'Vintermåned',r:'ᛁ'};
  if(m<=5)         return{e:'🌿',n:'Vårmåned',r:'ᛒ'};
  if(m<=8)         return{e:'☀️',n:'Sommermåned',r:'ᛋ'};
  return{e:'🍂',n:'Høstmåned',r:'ᛏ'};
}

// ══════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════
const TODAY = new Date();
const year  = TODAY.getFullYear();
let nameMode = 'kirke';
let moveables, gnSet, gnVal;

function initYear() {
  moveables = moveable(year);
  const gn = (year%19)+1;
  gnVal = gn;
  gnSet = new Set();
  (GN_TABLE[gn]||[]).forEach(({m,d})=>gnSet.add(`${m}-${d}`));
}

function getFeast(m0,d) {
  const key=`${m0+1}-${d}`;
  const fx=FIXED[key]; if(fx) return{...fx,mov:false};
  return moveables[key]||null;
}

function label(feast) {
  if(!feast) return'';
  return nameMode==='kirke'?feast.k: nameMode==='folk'?feast.f: feast.d||feast.k;
}

function tradName(m0,d) {
  const feast=getFeast(m0,d);
  const key=`${m0+1}-${d}`;
  if(nameMode==='dag') return feast?(feast.d||feast.k):(DAYNAMES[key]||'');
  return feast?label(feast):'';
}

// ══════════════════════════════════════════════
// BUILD STAVES
// ══════════════════════════════════════════════
function daysInMonth(y,m){return new Date(y,m+1,0).getDate();}

// months 0-5 = winter side, 6-11 = summer side
function buildHalf(plank, months) {
  plank.innerHTML='';
  months.forEach((m0,idx) => {
    const days = daysInMonth(year, m0);
    const band = document.createElement('div');
    band.className='month-band';

    // month label tab
    const tag = document.createElement('div');
    tag.className='month-tag';
    tag.textContent = MON[m0].toUpperCase().slice(0,3);
    band.appendChild(tag);

    for(let d=1;d<=days;d++){
      const dt    = new Date(year,m0,d);
      const dow   = dt.getDay();
      const isT   = dt.toDateString()===TODAY.toDateString();
      const feast = getFeast(m0,d);
      const gnKey = `${m0+1}-${d}`;
      const isGN  = gnSet.has(gnKey);

      const slot = document.createElement('div');
      slot.className='day-slot';
      if(dow===0)    slot.classList.add('sunday');
      if(isT)        slot.classList.add('today');
      if(feast?.mov) slot.classList.add('moveable');
      else if(feast) slot.classList.add('feast');

      // day number (sparse)
      const showNum=[1,5,10,15,20,25].includes(d);
      const numEl = document.createElement('div');
      numEl.className='day-num'+(showNum?'':' hidden');
      numEl.textContent=d;
      slot.appendChild(numEl);

      // the carved mark
      const mark = document.createElement('div');
      mark.className='mark';
      if(feast){
        const cross=document.createElement('div');
        cross.className='cross';
        mark.appendChild(cross);
      }
      const stem=document.createElement('div');
      stem.className='stem';
      mark.appendChild(stem);
      slot.appendChild(mark);

      // golden number badge
      if(isGN){
        const gn=document.createElement('div');
        gn.className='gn-badge';
        gn.textContent=gnVal;
        slot.appendChild(gn);
      }

      slot.addEventListener('click',()=>openPopup(year,m0,d));
      band.appendChild(slot);
    }
    plank.appendChild(band);
  });
}

function buildStaves() {
  buildHalf(document.getElementById('winterStave'), [0,1,2,3,4,5]);
  buildHalf(document.getElementById('summerStave'), [6,7,8,9,10,11]);
}

// ══════════════════════════════════════════════
// POPUP
// ══════════════════════════════════════════════
function openPopup(yr,m0,d){
  const dt    = new Date(yr,m0,d);
  const dow   = dt.getDay();
  const feast = getFeast(m0,d);
  const sea   = season(m0);
  const moon  = moonPhase(dt);
  const gnKey = `${m0+1}-${d}`;
  const isGN  = gnSet.has(gnKey);
  const isT   = dt.toDateString()===TODAY.toDateString();
  const tn    = tradName(m0,d);

  document.getElementById('pDate').textContent =
    `${WD[dow]} ${d}. ${MON[m0].toLowerCase()}`;
  document.getElementById('pTrad').textContent = tn;
  document.getElementById('pSub').textContent  =
    `${yr}` + (isT?' · I dag':'');

  document.getElementById('pGolden').innerHTML = isGN
    ?`<div class="popup-gn">🌙 Gyllentall ${gnVal} — ny-måne-dag</div>`:'';

  document.getElementById('pSeason').innerHTML=`
    <div class="season-emoji">${sea.e}</div>
    <div class="season-info">
      <div class="slabel">Primstav-merke</div>
      <div class="sval">${sea.n}</div>
    </div>
    <div class="season-rune">${sea.r}</div>`;

  if(feast){
    const cls=feast.mov?'feast-box mov':'feast-box';
    const lbl=label(feast);
    const alt=(nameMode!=='folk'&&feast.f&&feast.f!==lbl)
      ?`<div class="feast-folk">${feast.f}</div>`:'';
    document.getElementById('pFeast').innerHTML=`
      <div class="${cls}">
        <div class="feast-name">${feast.s} ${lbl}</div>
        ${alt}
        <div class="feast-desc">${feast.desc}</div>
      </div>`;
  } else {
    document.getElementById('pFeast').innerHTML='';
  }

  document.getElementById('pMoon').innerHTML=`
    <div class="moon-tag">${moon.e} ${moon.n}</div>
    <div class="moon-tag">${RUNES[((m0*30+d)%RUNES.length)]}</div>`;

  document.getElementById('overlay').classList.add('open');

  // scroll today's slot into view
  document.querySelector('.day-slot.selected')?.classList.remove('selected');
}

document.getElementById('overlay').addEventListener('click', e=>{
  if(e.target===e.currentTarget) document.getElementById('overlay').classList.remove('open');
});
document.getElementById('popupClose').addEventListener('click',()=>{
  document.getElementById('overlay').classList.remove('open');
});

// ══════════════════════════════════════════════
// MODE TOGGLE
// ══════════════════════════════════════════════
document.querySelectorAll('.mode-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    nameMode=btn.dataset.mode;
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    buildStaves();
  });
});

// ══════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════
document.getElementById('yearLabel').textContent = year;
initYear();
buildStaves();

// scroll to today on load
setTimeout(()=>{
  const allSlots = document.querySelectorAll('.day-slot.today');
  if(allSlots.length>0) allSlots[0].scrollIntoView({behavior:'smooth',block:'center'});
},200);
</script>
